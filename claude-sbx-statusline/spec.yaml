schemaVersion: "1"
kind: mixin
name: claude-sbx-statusline
displayName: Claude Code Status Line
description: Adds a two-line Claude Code status line tailored to Docker Sandboxes. Line one shows the Docker whale, the sandbox name (container hostname), the workspace path with the home prefix collapsed to ~, and the git branch with a dirty marker. Line two shows the model, effort level, a context-window bar, 5-hour and 7-day quota bars (with time until the 5h window resets), and session cost. Ships a self-contained bash script (jq + git only, no npm, no network) to ~/.claude/statusline.sh and sets the statusLine key in ~/.claude/settings.json, merging so every other setting is preserved (an existing statusLine is intentionally replaced, since installing this status line is the point of the kit).

requires:
  agent: claude

commands:
  install:
    - command: |
        set -euo pipefail
        mkdir -p /home/agent/.claude
        f=/home/agent/.claude/settings.json
        [ -f "$f" ] || echo '{}' > "$f"
        # Set only the statusLine key (any existing one is replaced by design);
        # the jq merge leaves all other settings untouched. Temp file lives in the
        # same dir as $f so the mv below is an atomic rename, not a cross-fs copy.
        # Invoke via bash so the script works even if the copied file loses its
        # executable bit.
        tmp=$(mktemp -p /home/agent/.claude)
        jq '.statusLine = {type: "command", command: "bash /home/agent/.claude/statusline.sh"}' "$f" > "$tmp"
        mv "$tmp" "$f"
        chown -R agent:agent /home/agent/.claude
      user: "0"
      description: Point the statusLine key in ~/.claude/settings.json at the shipped ~/.claude/statusline.sh (jq merge, so all other keys are preserved; any existing statusLine is replaced by design)

agentContext: |
  ## Status line

  This sandbox renders a two-line Claude Code status line from
  ~/.claude/statusline.sh, registered under `statusLine` in
  ~/.claude/settings.json. Line one shows the Docker whale, the sandbox name
  (the container hostname), the workspace path with the home prefix collapsed
  to ~, and the git branch with a `*` when the tree is dirty. Line two shows
  the model, the reasoning effort level, a context-window bar with percentage,
  5-hour and 7-day quota bars (claude.ai subscribers only; blank otherwise; the
  5h one shows time until the window resets), and the session cost so far.

  The script reads the session JSON Claude Code passes on stdin and needs only
  jq and git. It makes no network calls. Edit ~/.claude/statusline.sh to change
  segments or colours; the next render picks the change up, no restart needed.
